# CodeBuild project games-mp-migrate (games-multiplayer-deploy.tf).
#
# Applies a main commit's Supabase migrations, every .sql file under supabase/migrations, over
# verify-full TLS against the pinned Supabase CA: first the mp ones (the files that set
# mp_private.schema_revision) by revision, then every other file by name, each in one
# transaction with its row in the ledger migrations_private.applied (bringup.py has the
# rules). It runs this repo's driver and psql only, no code of the games repo. The database URL
# comes from secret games/mp-db-url straight into the environment (CodeBuild masks it in logs).
version: 0.2

env:
  shell: bash
  secrets-manager:
    GAMES_MP_DB_URL: games/mp-db-url
  exported-variables:
    - GAMES_MP_DB_REVISION
    - GAMES_SITE_DB_MIGRATIONS
    - GAMES_SITE_DB_NEWEST

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - if command -v dnf >/dev/null; then dnf install -y -q postgresql16; else yum install -y -q postgresql; fi
      - psql --version
  build:
    commands:
      - python3 .games-mp/bringup.py codebuild-migrate
      - . .games-mp/exports.sh && export GAMES_MP_DB_REVISION GAMES_SITE_DB_MIGRATIONS GAMES_SITE_DB_NEWEST
