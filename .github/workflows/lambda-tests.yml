name: Runner Lambda Tests

# The runner Lambdas are inline Python inside runner-autoscale.tf, so nothing
# runs them before they are deployed. This exercises the real heredoc bodies
# against fakes - no AWS credentials, no network, no OIDC role.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Test-only workflow: never expose the checkout token to PR code.
permissions:
  contents: read

jobs:
  lambda-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Runner Lambda logic
        run: python3 scripts/test-runner-lambdas.py

      - name: Backup copy and restore safety
        run: python3 -S -B scripts/test-backup-recovery.py

      - name: Backup Terraform topology boundaries
        run: python3 -S -B scripts/test-backup-topology.py

      - name: Security group descriptions use only characters EC2 accepts
        run: python3 -S -B scripts/test-sg-descriptions.py

      - name: PR and issue watch installer and hook
        run: python3 -B scripts/test-pr-watch.py

      - name: Tests are quiet when they pass (unittest buffer, the custom runner holds each case's output)
        run: python3 -S -B scripts/test-tests-quiet.py

      - name: Agent instructions distributed from ejc3/agents-md
        run: python3 -S -B scripts/test-agents-md.py

      - name: Machine-local agent instructions from administration-only secrets, and the Codex skills mirror
        run: python3 -S -B scripts/test-agent-local-md.py

      - name: Dolphin relay deploy credentials stay in a main-only environment
        run: python3 -S -B scripts/test-dolphin-relay.py
      - name: dolphin-family (deploy token in a main-only environment, runners behind a closed gate)
        run: python3 -S -B scripts/test-dolphin-family.py
      - name: dolphin-labs' post-deploy log token reads logs only, from a main-only environment
        run: python3 -S -B scripts/test-dolphin-labs-ci-logs.py
      - name: dolphin-labs podcasts R2 (a private bucket, a token for its objects only, written to the Dolphin account)
        run: python3 -S -B scripts/test-dolphin-labs-podcasts.py
      - name: browser-manager tunnel rotation (browser-manager.tf)
        run: python3 -S -B scripts/test-browser-manager-tunnel.py

      - name: One Terraform run at a time on the jumpboxes (run-lock wrapper)
        run: python3 -B scripts/test-terraform-run-lock.py

      - name: Dev-host credential boundaries
        run: python3 -S -B scripts/test-dev-credential-boundary.py

      - name: IPv4 IP-options mitigation ownership, atomicity and boot persistence (offline)
        run: python3 -S -B scripts/test-cve-2026-98432-mitigation.py

      - name: Continuous Fleet image factory, bounded publication and stale-plan protection
        run: |
          python3 -S -B scripts/test-fcvm-fleet-ami-pipeline.py
          python3 -S -B scripts/test-fcvm-ami-publish.py
          python3 -S -B scripts/test-fcvm-ami-release.py

      - name: Metal secondary IPv4 persists across boots without restarting networking
        run: python3 -S -B scripts/test-fcvm-secondary-ipv4.py

      - name: ARM public address cutover and operator-supplied script destinations
        run: python3 -S -B scripts/test-fcvm-arm-address.py

      - name: Jumpbox native Claude installation boundaries
        run: python3 -S -B scripts/test-jumpbox-native-claude.py

      - name: Dolphin SSH tunnel routing
        run: python3 -S -B scripts/test-dolphin-ssh.py

      - name: ndev unpublishes deleted projects without restart loops (offline)
        run: python3 -S -B scripts/test-ndev-prune.py

      - name: Security delivery watchdog
        run: python3 -S -B scripts/test-security-delivery.py

      - name: Security alert digest (dedupe, immediate vs digest, one message a minute, nothing lost on failure)
        run: python3 -S -B scripts/test-security-alert-digest.py

      - name: Regional account-default boundaries
        run: python3 -S -B scripts/test-security-defaults.py

      - name: Free external-access analyzer boundaries
        run: python3 -S -B scripts/test-security-external-access.py

      - name: Account-wide S3 public-access boundaries
        run: python3 -S -B scripts/test-s3-account-public-access.py

      - name: Security Hub suppressions stay narrow; default security groups stay empty
        run: python3 -S -B scripts/test-security-hub-automation.py

      - name: ECS task definitions keep read-only root filesystems (ECS.5)
        run: python3 -S -B scripts/test-ecs-readonly-root.py

      - name: Runner user_data IPv6 gate
        run: bash scripts/test-runner-userdata.sh

      - name: Runner IAM canary acceptance guards
        run: python3 -S -B scripts/test-runner-iam-canary.py

      - name: GPU test box launch boundaries
        run: python3 -S -B scripts/test-gpu-box.py

      - name: Runner IAM least-privilege boundaries
        run: python3 -S -B scripts/test-runner-iam-boundary.py

      - name: Runner release freshness guards (offline)
        run: python3 -S -B scripts/test-runner-release-freshness.py

      - name: Applied-status publisher (offline)
        run: bash scripts/test-publish-applied-status.sh

      - name: Atuin agent hook normalizer (offline)
        run: python3 -S -B scripts/test-atuin-agent-hooks.py

      - name: Host access audit agent and Terraform boundaries (offline)
        run: python3 -S -B scripts/test-access-audit.py

      - name: Host access audit Linux sensor (live fanotify, root)
        run: sudo python3 -S -B scripts/test-access-audit-live.py

      - name: Admin box setup and Codex host guidance (offline)
        run: python3 -S -B scripts/test-admin-box-setup.py

      - name: Starter user-level agent instructions only for accounts that have none (offline)
        run: python3 -S -B scripts/test-user-agents.py

      - name: Dev-hop private key never reaches xtrace output (offline)
        run: python3 -S -B scripts/test-dev-hop-xtrace.py

      - name: Scroll-native tmux installs beside the normal one (offline)
        run: python3 -S -B scripts/test-tmux-scroll-install.py
      - name: Containerized nextjs box (offline)
        run: python3 -S -B scripts/test-nextjs-ct.py
      - name: Containerized nextjs box, container layer (offline)
        run: python3 -S -B scripts/test-nextjs-ct-containers.py
      - name: Boot-time Codex thread seeding
        run: python3 -S -B scripts/test-codex-seed.py
      - name: ssh mac and ssh colton-mac client installer, their Cloudflare routes and the Mac connector setup (offline)
        run: python3 -S -B scripts/test-mac-ssh-client.py
      - name: ssh colin-pc's Cloudflare route, the Windows PC setup, its bootstrap and the Windows-MCP bridge (offline)
        run: python3 -S -B scripts/test-windows-pc-setup.py
      - name: PC enrollment Lambda (Access token check, host-key pin, prerequisites first; offline)
        run: node --version && node --test scripts/test-pc-enroll.mjs
      - name: PC enrollment Terraform (owner-only Access, strict TLS, no default endpoint, exact grants)
        run: python3 -S -B scripts/test-pc-enroll-terraform.py
      - name: Astryx Swift TestFlight invitations Worker (Turnstile first, @meta.com only, per-IP and daily limits, App Store Connect outcomes, no address logged; offline)
        run: node --version && node --test scripts/test-astryx-join.mjs
      - name: "Astryx Swift TestFlight invitations Terraform (public through a bypass for exactly its host, a managed Turnstile widget, KV limits, the App Manager key only, off until its secret exists)"
        run: python3 -S -B scripts/test-astryx-join.py
      - name: Mac agent tools, lease, build cap and the pinned Peekaboo install (offline)
        run: python3 -S -B scripts/test-mac-setup.py
      - name: Mac pbox explicit paid-lease approval, discovery and isolated workspaces (offline)
        run: python3 -S -B scripts/test-macpbox.py
      - name: Mac pbox 24-hour minimum and periodic safe host release (offline)
        run: python3 -S -B scripts/test-macpbox-cleanup.py
      - name: Metal boxes keep their box tools (pbox, gbox, wbox, codex-restart) equal to main daily (offline)
        run: python3 -S -B scripts/test-metal-box-tools.py
      - name: App-repo runners route, launch, cap and reap (offline)
        run: python3 -S -B scripts/test-app-runner.py
      - name: App-repo runner images build weekly, from Canonical's image, and retire only their own (offline)
        run: python3 -S -B scripts/test-app-runner-image.py

      - name: Console capture redacts private keys before archiving (offline)
        run: python3 -S -B scripts/test-console-capture-redaction.py

      - name: Boot secrets stay out of traces, readable logs and command lines (offline)
        run: python3 -S -B scripts/test-boot-secret-hygiene.py

      - name: Games multiplayer engine sweeper (offline)
        run: python3 -S -B scripts/test-games-mp-sweeper.py

      - name: Games multiplayer launch admission (offline)
        run: python3 -S -B scripts/test-games-mp-launch.py

      - name: play.cc-games.app edge protections (offline)
        run: python3 -S -B scripts/test-games-mp-edge.py

      - name: Games multiplayer bring-up steps (offline)
        run: python3 -S -B scripts/test-games-mp-bringup.py

      # Starts its own PostgreSQL in a temporary directory, on a Unix socket only; the runner
      # image ships the server binaries under /usr/lib/postgresql.
      - name: Games site migrations against a temporary PostgreSQL (ledger, baseline, refusals)
        run: python3 -S -B scripts/test-games-site-migrations.py

      - name: Games multiplayer automatic deploys (offline)
        run: python3 -S -B scripts/test-games-mp-deploy.py

      - name: Games pipeline read-only view for the dev boxes
        run: python3 -S -B scripts/test-games-mp-observe.py

      - name: Imagine scale function (wake, sweep to zero, roll) and its wiring
        run: python3 -S -B scripts/test-imagine-scale.py

      - name: opencode reaches DeepSeek on Bedrock through the instance role
        run: python3 -S -B scripts/test-opencode-setup.py

      - name: Dev-box AI services and price lists (ElevenLabs key readers, public prices only)
        run: python3 -S -B scripts/test-dev-ai-services.py

      - name: dolphin-labs.dev email forwards (privacy, ej@, steve@ from people/addresses only)
        run: python3 -S -B scripts/test-dolphin-labs-email.py

      - name: Sending as the dolphin-labs.dev ej@ address (SES in the Dolphin account, one action from one address, SMTP password only in its secret)
        run: python3 -S -B scripts/test-dolphin-labs-email-send.py

      - name: Search and fetch provider usage poller (parsing, publishing, no key in logs)
        run: python3 -S -B scripts/test-search-fetch-usage.py

      - name: Claude Haiku 5.5 on Bedrock (nextjs-dev and one dolphin-labs workflow on main, no other model)
        run: python3 -S -B scripts/test-bedrock-haiku.py

      - name: Colton Games accounts (production for administration only, nothing read or written until the gate names a secret)
        run: python3 -S -B scripts/test-colton-games-accounts.py

      - name: claude-master dashboard site Access
        run: python3 -S -B scripts/test-claw-master-dashboard-site.py
      - name: colton-games picture moderation grant
        run: python3 -S -B scripts/test-colton-games-moderation.py
      - name: dolphin-maps picture and text moderation (two actions, each in its own region, Dolphin account, each key to its own Worker)
        run: python3 -S -B scripts/test-dolphin-maps-moderation.py
      - name: dolphin-films credentials (production for administration only, non-production for the metal dev role)
        run: python3 -S -B scripts/test-dolphin-films.py

      - name: "Dolphin Vercel team retired: nothing manages it, its Terraform objects are forgotten without a Vercel call"
        run: python3 -S -B scripts/test-dolphin-vercel-retired.py
      - name: dolphin-maps loops (schedules off and in Los Angeles time, the app's secret for the function only, deploy from main)
        run: python3 -S -B scripts/test-dolphin-maps-loop.py

      - name: Windows playtest box (dev-box-only access, no peer route, kept game disk, 1h idle stop)
        run: python3 -S -B scripts/test-wbox.py
      - name: Members' own wbox, pbox and gbox (member-*.tf, scripts/wbox-member.sh, member modes of pbox/gbox/wbox)
        run: python3 -S -B scripts/test-member-boxes.py
      - name: codex-restart (running vs installed, refuses over running commands, restarts only stale daemons)
        run: python3 -S -B scripts/test-codex-restart.py
      - name: Codex refresh on the ubuntu boxes (weekly SSM association)
        run: python3 -S -B scripts/test-codex-update.py
      - name: Daily Claude Code update on the ubuntu boxes (offline)
        run: python3 -S -B scripts/test-claude-update.py
      - name: Shared claude-master server (private, pinned, idle until its logins exist)
        run: python3 -S -B scripts/test-claw-master-server.py
      - name: New repositories get Claude and Codex sessions within seconds (agent-session-sync)
        run: python3 -S -B scripts/test-agent-session-sync.py

      - name: Memory and swap alarms can see data and never read no data as healthy (nextjs-dev, claude-master)
        run: python3 -S -B scripts/test-nextjs-observability.py

      - name: A wedged persistent box is rebooted and nothing else is (auto-reboot Lambda)
        run: python3 -S -B scripts/test-auto-reboot.py

      - name: "yourfantasymovie.com DNS (Fantasy Films): proxied records and routes to dolphin-films-prod, no switch, one zone"
        run: python3 -S -B scripts/test-yourfantasymovie.py

      - name: "Dolphin Redis: in the Dolphin account, no inbound path, data kept, no credential in the file"
        run: python3 -S -B scripts/test-dolphin-redis.py

      - name: "claude-master certificates renew themselves: the four SSM scripts run for real, the Lambda against fake AWS, the role can send nothing else"
        run: python3 -S -B scripts/test-claw-master-cert-renew.py

      - name: "Vercel environment record: the capture tool only ever deploys staged and protected, reads after a 401, and deletes by deployment id"
        run: python3 -S -B scripts/test-vercel-env-capture.py

      - name: "Staging Workers' secrets kept in AWS: one administrators-only container per site and a loader that never prints a value"
        run: python3 -S -B scripts/test-workers-stage-secrets.py

      - name: "Staging Workers: one Access application over every Worker, URL switches owned by Terraform, Access before URLs"
        run: python3 -S -B scripts/test-workers-stage.py

      - name: "Colton Games production on Cloudflare: one cutover switch (off), hostname Access before cutover, Free-plan zone protection without Bot Fight Mode, one-purpose keys, a loader that never mixes or prints values"
        run: python3 -S -B scripts/test-cloudflare-production.py

      - name: "Workers deploy token: a typed Cloudflare token resource, an administrators-only container, no secret on a command line"
        run: python3 -S -B scripts/test-workers-deploy.py

      - name: "Cloudflare observability token: read-only groups, account and zones, no Access logs, dev boxes may read it"
        run: python3 -S -B scripts/test-cloudflare-observability.py

      - name: "fcvm.dev DNS test token: DNS Read and Write on fcvm.dev only, dev-fleet client IPs from Terraform, an expiry, dev-server-role reads it"
        run: python3 -S -B scripts/test-fcvm-dns-test.py

      - name: "GitHub App token: a JWT GitHub accepts, the installation token, retries only on transient errors"
        run: python3 -B scripts/test-github-app-token.py

      - name: "Vercel environments from AWS: every variable imported by id, values only from the containers, inventory current with its generator"
        run: python3 -S -B scripts/test-vercel-env.py

      - name: "Metal boot scripts: a reboot keeps the NVMe, earlyoom guards memory, dnsmasq cannot race resolved"
        run: python3 -S -B scripts/test-metal-boot.py

      - name: "People's addresses live in the people/addresses secret, not in git (people.tf)"
        run: python3 -S -B scripts/test-people.py

      - name: "The Dolphin account: its own OU, root address from people/addresses, never closed by Terraform"
        run: python3 -S -B scripts/test-dolphin-account.py
      - name: constellation account (fcvm-arm only, one exact role, no organization path; offline)
        run: python3 -S -B scripts/test-constellation-account.py

      - name: "fcvm-fleet member account: guardrails, fcvm-arm-only apply role, G spot quotas (fcvm-fleet-account.tf)"
        run: python3 -S -B scripts/test-fcvm-fleet-account.py

      - name: "astryx member account and staging: us-west-1 guardrails, one exact apply role, Access sign-in on /native/login, the rest bypassed to the API token (astryx-account.tf, astryx-stage.tf)"
        run: python3 -S -B scripts/test-astryx-account.py

      - name: "fcvm.dev: DNSSEC, DNS-only token, coordinator tunnel behind Access, staging only (fcvm-dev.tf)"
        run: python3 -S -B scripts/test-fcvm-dev.py

      - name: "fcvm-fleet infrastructure: 443 plus the slot ports over IPv4, gated GPU hosts and coordinator, tile-only coordinator role (fcvm-fleet.tf)"
        run: python3 -S -B scripts/test-fcvm-fleet.py

      - name: "Coordinator releases: image-only changes, Terraform backend lock ownership and rollback"
        run: python3 -S -B scripts/test-fcvm-coordinator-release.py

      - name: Turso API token is readable by the metal boxes and administration only
        run: python3 -S -B scripts/test-turso-token.py

      - name: The parallel boxes can run in us-east-2 (ohio-pbox.tf); pbox reads its region from Terraform
        run: python3 -S -B scripts/test-pbox-ohio.py

      - name: Runner launcher and cleanup are region-aware; control plane stays in us-west-1
        run: python3 -S -B scripts/test-runner-regions.py

      - name: Ohio is prepared and idle; runner AMIs are replicated (ohio.tf, ami-replicator)
        run: python3 -S -B scripts/test-ohio-runner-prep.py

      - name: pbox shows whether a parallel box is bought spot or on-demand
        run: python3 -S -B scripts/test-parallel-box-mode.py

      - name: "pbox up --fallback: other US AZs with a fresh work volume; plain up exits 3 naming it (pbox-fallback.tf)"
        run: python3 -S -B scripts/test-pbox-fallback.py

      - name: "pbox up --open: the open security group and a delegated IPv6 /80, home only, never a member's box"
        run: python3 -S -B scripts/test-pbox-open.py

      - name: "pbox up --on-demand: one launch bought on-demand from each box's -ondemand template, the on-demand price and quota, never a member's box"
        run: python3 -S -B scripts/test-pbox-on-demand.py

      - name: "pbox up --lease: the instance is tagged with the lease end, the watchdog keeps an owner's box until then (12h cap), status shows it"
        run: python3 -S -B scripts/test-pbox-lease.py

      - name: "pbox acts on the instance it launched: id= on up, --instance on ip/ssh/down, PboxLaunchedBy (#621)"
        run: python3 -S -B scripts/test-pbox-instance.py

      - name: "pbox up needs a flavor; each flavor tries only its own types; IAM allows exactly the flavors' types (pbox-flavors.tf)"
        run: python3 -S -B scripts/test-pbox-flavors.py

      - name: I/O box NFS admits only its client subnets (offline)
        run: python3 -S -B scripts/test-io-box-nfs.py

      - name: Greptile review settings and rule scopes (offline)
        run: python3 -S -B scripts/test-greptile-config.py

      - name: "gamesworthwatching.com: proxied records and routes to dolphin-labs-prod, no switch; http and www redirected at the edge"
        run: python3 -S -B scripts/test-gww-redirects.py

      - name: "mapslink.app: every request a 302 to the Dolphin Maps car page, proxied with no origin, no Access gate"
        run: python3 -S -B scripts/test-mapslink.py

      - name: "Dolphin Maps production: maps.dolphin-labs.dev routed to dolphin-maps-prod, public through its own bypass application after the route, wildcard gate unchanged; the loader reads the Dolphin account"
        run: python3 -S -B scripts/test-dolphin-maps-prod.py

      - name: CI settings audit parses every trigger and reports failed reads (offline)
        run: python3 -S -B scripts/test-audit-ci-settings.py
