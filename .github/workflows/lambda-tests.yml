name: Runner Lambda Tests

# The runner Lambdas are inline Python inside runner-autoscale.tf, so nothing
# runs them before they are deployed. This exercises the real heredoc bodies
# against fakes - no AWS credentials, no network, no OIDC role.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Test-only workflow: never expose the checkout token to PR code.
permissions:
  contents: read

jobs:
  lambda-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Runner Lambda logic
        run: python3 scripts/test-runner-lambdas.py

      - name: Backup copy and restore safety
        run: python3 -S -B scripts/test-backup-recovery.py

      - name: Backup Terraform topology boundaries
        run: python3 -S -B scripts/test-backup-topology.py

      - name: Security group descriptions use only characters EC2 accepts
        run: python3 -S -B scripts/test-sg-descriptions.py

      - name: Dev-host credential boundaries
        run: python3 -S -B scripts/test-dev-credential-boundary.py

      - name: Jumpbox native Claude installation boundaries
        run: python3 -S -B scripts/test-jumpbox-native-claude.py

      - name: Dolphin SSH tunnel routing
        run: python3 -S -B scripts/test-dolphin-ssh.py

      - name: ndev unpublishes deleted projects without restart loops (offline)
        run: python3 -S -B scripts/test-ndev-prune.py

      - name: Security delivery watchdog
        run: python3 -S -B scripts/test-security-delivery.py

      - name: Regional account-default boundaries
        run: python3 -S -B scripts/test-security-defaults.py

      - name: Free external-access analyzer boundaries
        run: python3 -S -B scripts/test-security-external-access.py

      - name: Account-wide S3 public-access boundaries
        run: python3 -S -B scripts/test-s3-account-public-access.py

      - name: Runner user_data IPv6 gate
        run: bash scripts/test-runner-userdata.sh

      - name: Runner IAM canary acceptance guards
        run: python3 -S -B scripts/test-runner-iam-canary.py

      - name: GPU test box launch boundaries
        run: python3 -S -B scripts/test-gpu-box.py

      - name: Runner IAM least-privilege boundaries
        run: python3 -S -B scripts/test-runner-iam-boundary.py

      - name: Runner release freshness guards (offline)
        run: python3 -S -B scripts/test-runner-release-freshness.py

      - name: Applied-status publisher (offline)
        run: bash scripts/test-publish-applied-status.sh

      - name: Atuin agent hook normalizer (offline)
        run: python3 -S -B scripts/test-atuin-agent-hooks.py

      - name: Admin box setup and Codex host guidance (offline)
        run: python3 -S -B scripts/test-admin-box-setup.py

      - name: Starter user-level agent instructions only for accounts that have none (offline)
        run: python3 -S -B scripts/test-user-agents.py

      - name: Dev-hop private key never reaches xtrace output (offline)
        run: python3 -S -B scripts/test-dev-hop-xtrace.py

      - name: Scroll-native tmux installs beside the normal one (offline)
        run: python3 -S -B scripts/test-tmux-scroll-install.py
      - name: Boot-time Codex thread seeding
        run: python3 -S -B scripts/test-codex-seed.py
      - name: App-repo runners route, launch, cap and reap (offline)
        run: python3 -S -B scripts/test-app-runner.py

      - name: Console capture redacts private keys before archiving (offline)
        run: python3 -S -B scripts/test-console-capture-redaction.py

      - name: Boot secrets stay out of traces, readable logs and command lines (offline)
        run: python3 -S -B scripts/test-boot-secret-hygiene.py

      - name: Games multiplayer engine sweeper (offline)
        run: python3 -S -B scripts/test-games-mp-sweeper.py

      - name: Games multiplayer launch admission (offline)
        run: python3 -S -B scripts/test-games-mp-launch.py

      - name: play.cc-games.app edge protections (offline)
        run: python3 -S -B scripts/test-games-mp-edge.py

      - name: Games multiplayer bring-up steps (offline)
        run: python3 -S -B scripts/test-games-mp-bringup.py

      # Starts its own PostgreSQL in a temporary directory, on a Unix socket only; the runner
      # image ships the server binaries under /usr/lib/postgresql.
      - name: Games site migrations against a temporary PostgreSQL (ledger, baseline, refusals)
        run: python3 -S -B scripts/test-games-site-migrations.py

      - name: Games multiplayer automatic deploys (offline)
        run: python3 -S -B scripts/test-games-mp-deploy.py

      - name: Games pipeline read-only view for the dev boxes
        run: python3 -S -B scripts/test-games-mp-observe.py

      - name: Imagine scale function (wake, sweep to zero, roll) and its wiring
        run: python3 -S -B scripts/test-imagine-scale.py

      - name: opencode reaches DeepSeek on Bedrock through the instance role
        run: python3 -S -B scripts/test-opencode-setup.py

      - name: Dev-box AI services and price lists (ElevenLabs key readers, public prices only)
        run: python3 -S -B scripts/test-dev-ai-services.py

      - name: Colton Games accounts (production for administration only, nothing read or written until the gate names a secret)
        run: python3 -S -B scripts/test-colton-games-accounts.py

      - name: dolphin-films credentials (production for administration only, non-production for the metal dev role)
        run: python3 -S -B scripts/test-dolphin-films.py

      - name: Windows playtest box (dev-box-only access, no peer route, kept game disk, 1h idle stop)
        run: python3 -S -B scripts/test-wbox.py
      - name: codex-restart (running vs installed, refuses over running commands, restarts only stale daemons)
        run: python3 -S -B scripts/test-codex-restart.py
      - name: Codex refresh on the ubuntu boxes (weekly SSM association)
        run: python3 -S -B scripts/test-codex-update.py
      - name: Shared claude-master server (private, pinned, idle until its logins exist)
        run: python3 -S -B scripts/test-claude-master-server.py
      - name: New repositories get Claude and Codex sessions within seconds (agent-session-sync)
        run: python3 -S -B scripts/test-agent-session-sync.py

      - name: Memory and swap alarms can see data and never read no data as healthy (nextjs-dev, claude-master)
        run: python3 -S -B scripts/test-nextjs-observability.py

      - name: A wedged persistent box is rebooted and nothing else is (auto-reboot Lambda)
        run: python3 -S -B scripts/test-auto-reboot.py

      - name: "yourfantasymovie.com DNS (Fantasy Films): DNS only, Vercel's records, one zone"
        run: python3 -S -B scripts/test-yourfantasymovie.py

      - name: "People's addresses live in the people/addresses secret, not in git (people.tf)"
        run: python3 -S -B scripts/test-people.py

      - name: Turso API token is readable by the metal boxes and administration only
        run: python3 -S -B scripts/test-turso-token.py

      - name: The parallel boxes can run in us-east-2 (ohio-pbox.tf); pbox reads its region from Terraform
        run: python3 -S -B scripts/test-pbox-ohio.py

      - name: Runner launcher and cleanup are region-aware; control plane stays in us-west-1
        run: python3 -S -B scripts/test-runner-regions.py

      - name: Ohio is prepared and idle; runner AMIs are replicated (ohio.tf, ami-replicator)
        run: python3 -S -B scripts/test-ohio-runner-prep.py

      - name: I/O box NFS admits only its client subnets (offline)
        run: python3 -S -B scripts/test-io-box-nfs.py

      - name: Greptile review settings and rule scopes (offline)
        run: python3 -S -B scripts/test-greptile-config.py
